<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Facet Gradients -->
    <linearGradient id="topFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d50bb" />
      <stop offset="100%" stop-color="#6e48aa" />
    </linearGradient>

    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4776e6" />
      <stop offset="100%" stop-color="#3b2b85" />
    </linearGradient>

    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8e2de2" />
      <stop offset="100%" stop-color="#4a00e0" />
    </linearGradient>

    <!-- Node Glow / 3D Spheres -->
    <radialGradient id="sphereLight" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>

    <!-- Subtle Node Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(256, 256)">
    <!-- 1. Crystal Facets -->
    <!-- Top Face -->
    <path d="M 0 -185 L 160 -92 L 0 0 L -160 -92 Z" fill="url(#topFacet)" fill-opacity="0.9" />
    
    <!-- Left Face -->
    <path d="M -160 -92 L 0 0 L 0 185 L -160 92 Z" fill="url(#leftFacet)" fill-opacity="0.88" />
    
    <!-- Right Face -->
    <path d="M 160 -92 L 0 0 L 0 185 L 160 92 Z" fill="url(#rightFacet)" fill-opacity="0.92" />

    <!-- 2. Glassmorphic Highlights / Chamfer Edges -->
    <path d="M 0 -185 L 160 -92 L 0 0 Z" fill="#ffffff" fill-opacity="0.08" />
    <line x1="-160" y1="-92" x2="0" y2="-185" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.3" />
    <line x1="0" y1="-185" x2="160" y2="-92" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.3" />
    <line x1="-160" y1="92" x2="0" y2="185" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15" />
    <line x1="160" y1="92" x2="0" y2="185" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15" />

    <!-- 3. Interconnecting Graph Lattice Lines -->
    <g stroke="#ffffff" stroke-width="3" stroke-opacity="0.65" stroke-linecap="round">
      <line x1="0" y1="-185" x2="0" y2="0" />
      <line x1="-160" y1="-92" x2="0" y2="0" />
      <line x1="160" y1="-92" x2="0" y2="0" />
      <line x1="0" y1="185" x2="0" y2="0" />
    </g>

    <!-- 4. Corner & Center Orbital Nodes -->
    <!-- Outer Nodes -->
    <circle cx="0" cy="-185" r="16" fill="url(#sphereLight)" filter="url(#softGlow)" />
    <circle cx="-160" cy="-92" r="16" fill="url(#sphereLight)" filter="url(#softGlow)" />
    <circle cx="160" cy="-92" r="16" fill="url(#sphereLight)" filter="url(#softGlow)" />
    <circle cx="0" cy="185" r="16" fill="url(#sphereLight)" filter="url(#softGlow)" />

    <!-- Core Center Node -->
    <circle cx="0" cy="0" r="22" fill="url(#sphereLight)" filter="url(#softGlow)" />
  </g>
</svg>
